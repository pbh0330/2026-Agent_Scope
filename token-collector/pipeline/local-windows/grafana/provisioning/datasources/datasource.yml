# Docker 없이 실행할 때의 Grafana 데이터소스. Prometheus만 등록한다(Tempo는 Windows용 공식 빌드가 없어 제외).
# 패널의 점(exemplar)에 마우스를 올리면 trace_id는 그대로 보이지만, 눌러서 실행 기록으로 이동하는 연결은
# Tempo를 붙인 뒤(docker 구성) 동작한다.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: Prometheus          # 대시보드 패널이 이 uid로 데이터소스를 찾음
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
