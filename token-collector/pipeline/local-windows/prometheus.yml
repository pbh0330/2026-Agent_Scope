# Docker 없이 Windows에서 직접 실행할 때 쓰는 Prometheus 설정.
# 같은 PC에서 켜 둔 otelcol-agentscope.exe의 /metrics(9464)를 15초마다 긁어간다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - ../prometheus/rules.yml   # 이 파일 위치 기준 상대 경로(docker 구성과 같은 rule 사용)

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["localhost:9464"]
