# 토큰 사용량 파이프라인: 커스텀 Collector + Tempo + Prometheus + Grafana
#
#   OpenClaw ─OTLP(4318)→ otel-collector ─┬─ tokenattribution 커넥터 → /metrics(9464) ← prometheus(exemplar 저장)
#                                          ├─ 트레이스 원본 → tempo(3200에서 traceId로 조회)
#                                          └─ 원본 스팬 파일 → ./data/agentscope-traces.jsonl(usage.json 입력)
#   grafana(3000): Prometheus 패널의 점(exemplar)을 누르면 trace_id로 Tempo 화면이 열림
#
# 실행: 이 폴더에서  docker compose up -d --build
# 처음 실행 시 Collector 이미지를 소스에서 빌드하므로 몇 분 걸린다(Go 모듈 다운로드 포함).

services:
  otel-collector:
    build:
      context: ../collector          # Dockerfile이 OCB로 커스텀 Collector를 빌드
    image: agentscope/otelcol-agentscope:local
    command: ["--config=/etc/otelcol-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-config.yaml:ro
      - ./data:/data
    ports:
      - "4318:4318"   # OTLP/HTTP — openclaw.json의 diagnostics.otel.endpoint가 이 주소를 가리켜야 함
      - "9464:9464"   # 도구별 귀속 메트릭 + OpenClaw 코어 메트릭(/metrics)
    depends_on: [tempo]
    networks: [otel-net]

  tempo:
    image: grafana/tempo:3.0.0
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # 조회 API: GET /api/traces/<traceId>  (OTLP 수신 4317/4318은 내부 네트워크 전용)
    networks: [otel-net]

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage   # exemplar(trace_id)를 메트릭과 함께 저장
    ports:
      - "9090:9090"
    depends_on: [otel-collector]
    networks: [otel-net]

  grafana:
    image: grafana/grafana:13.1.3
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin   # 로컬 검증용 기본값 — 외부에 노출하는 환경이면 반드시 변경할 것
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, tempo]
    networks: [otel-net]

networks:
  otel-net:
    driver: bridge

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
